server:
  host: 0.0.0.0
  port: 8080
  # Upstream request timeout (default: 60s). Bounds a buffered upstream call
  # end to end, and bounds silence for a streamed generation. Sixty seconds
  # survives a slow first token while still failing over a stalled generation
  # before the client gives up.
  timeout: 60s
  # Total wall-clock budget for one streamed generation (default: 15m).
  # Bounds a stream that keeps trickling bytes and never finishes. 0 disables
  # the bound, leaving only silence bounded. On SIGTERM, in-flight streams are
  # drained for this long, capped at 30m so a hung process still exits. A
  # stream_timeout of 0 or longer than 30m therefore cuts at 30m on restart.
  stream_timeout: 15m


dashboard:
  # enabled: true  # serve the dashboard UI; false answers 404 for the UI and /internal/* (default: true)
  # auth: true  # HTTP basic auth (default: true). Requires OMNIGO_DASH_USER and OMNIGO_DASH_PASS; there is no default account.

# Observability. Metrics default to disabled.
# observability:
#   metrics: true  # expose Prometheus metrics at /actuator/metrics (default: false)

# Per-account quota polling, shown on the dashboard's provider cards.
# polling on, auto-drain opt-in: enabling this changes no routing behaviour.
# quota:
#   enabled: true      # poll provider quota endpoints (default: true)
#   interval: 5m       # minimum 1m (default: 5m)
#   auto_drain: false  # pre-drain an exhausted account so combos skip it (default: false)
#   max_cooldown: 30m  # cap on a quota drain, in case upstream reports a reset days away (default: 30m)

providers:
  # Antigravity provider (Google Gemini Code Assist)
  - name: agy
    type: antigravity
    # disabled: true  # skip this provider in routing and /v1/models
    base_url: https://daily-cloudcode-pa.googleapis.com
    # timeout: 60s  # per-provider override of server.timeout (default: server.timeout)
    # stream_timeout: 15m  # per-provider override of server.stream_timeout; 0 disables the bound
    # max_concurrency: 4  # cap in-flight requests per provider; excess requests fail fast with 429 and combo failover
    models:
      - gemini-3.7-flash-medium
      - gemini-3.7-flash-high
      - gemini-3.7-flash-low
      - gemini-3.1-pro-low
      - gemini-3.1-flash-lite
      - claude-sonnet-4-6
      - claude-opus-4-6-thinking
      - gpt-oss-120b-medium

  # ChatGPT Codex provider (authenticate from the dashboard)
  # - name: codex-main
  #   type: codex
  #   models:
  #     - gpt-6-astra
  #     - gpt-5.6-sol
  #     - gpt-6.1-sol
  #     - gpt-6-sol
  #     - gpt-6-luna

  # Standard OpenAI-compatible provider
  # - name: openai-main
  #   type: openai
  #   base_url: https://api.openai.com/v1
  #   models:
  #     - gpt-4o
  #     - gpt-4o-mini

combos:
  - name: auto
    strategy: priority # priority | fill-first | reliable | round-robin | smart
    # timeout: 120s  # total budget for the whole chain; split across the targets still to be tried. Unset = uncapped.
    targets:
      - provider: agy
        model: gemini-3.7-flash-medium
      # - provider: openai-main
      #   model: gpt-4o

  # A smart combo asks a TypeSafe System One model which route fits the
  # request, then dispatches to that route's destination. It declares no
  # target chain of its own: the destination combo owns the failover.
  #
  # Requires TYPESAFE_API_KEY in the gateway's environment. Every decision
  # is fail-open: if the model is unreachable, slow, or unsure, the default
  # route is used instead.
  #
  # Jev is TypeSafe's flagship System One model, but every System One model
  # is served by the same endpoint, so any model id or alias may be named.
  # - name: combo/smart
  #   strategy: smart
  #   default_route: flash   # used when the model cannot decide
  #   routes:
  #     - name: flash
  #       criteria: A short factual question
  #       destination: combo/flash      # a combo name, or provider/model
  #     - name: pro
  #       criteria: A hard engineering task
  #       destination: combo/pro
  #   decision:
  #     model: jev-latest      # any System One model id or alias; blank = jev-latest
  #     mode: choice           # choice (one question), or fanout (one per route)
  #     question: Which route should handle this request?
  #     min_confidence: "0.5"  # below this, the default route is used
  #     timeout: 4s            # blank = 4s
  #     # base_url: https://api.typesafe.ai   # blank = the public API
  #     # weights:                # fanout only; blank = 1.0 for every route
  #     #   flash: 1.0
  #     #   pro: 1.2

# Optional exact-match cache layer (disabled by default)
# cache:
#   enabled: false
#   backend: memory
#   ttl: 1h
#   max_items: 1000
#   redis_url: ""

